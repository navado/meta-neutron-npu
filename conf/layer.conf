# meta-neutron-npu: fix for the NXP Neutron NPU driver (drivers/staging/neutron) on i.MX95.
BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "neutron-npu"
BBFILE_PATTERN_neutron-npu = "^${LAYERDIR}/"
BBFILE_PRIORITY_neutron-npu = "8"
LAYERDEPENDS_neutron-npu = "core"
LAYERSERIES_COMPAT_neutron-npu = "whinlatter wrynose"
# Each kernel append is active only when its BSP layer is in the build:
#   fsl-bsp-release = meta-imx/meta-imx-bsp (linux-imx), meta-bsp-imx95 = Compulab's i.MX95 BSP (linux-compulab)
BBFILES_DYNAMIC += " \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/fsl-bsp-release/*/*/*.bbappend \
    meta-bsp-imx95:${LAYERDIR}/dynamic-layers/meta-bsp-imx95/*/*/*.bbappend \
"
